<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain-Apps</title>
<meta name="description" content="Una raccolta delle mie app web: piccoli strumenti minimali, da aprire subito dal browser.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="Brain-Apps">
<meta property="og:description" content="Una raccolta delle mie app web: piccoli strumenti minimali, da aprire subito dal browser.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0a'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%23bef264' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='9' fill='%23bef264'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #fafafa;
    --mut: #a3a3a3;
    --line: #2a2a2a;
    --card: rgba(20, 20, 20, 0.94);
    --lime: #bef264;
    --ink: #0a0a0a;
    --lime-sub: #27360a;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body.lock { overflow: hidden; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  #app > .wrap { flex: 1; width: 100%; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }

  /* Sfondo: cerchi concentrici */
  .bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 28px 0; font-family: var(--mono); font-size: 12px; color: var(--mut);
  }
  .status { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); display: inline-block; }

  /* Hero */
  h1 {
    margin-top: clamp(24px, 6vw, 56px);
    font-size: clamp(3rem, 10vw, 6.25rem);
    line-height: 0.95; letter-spacing: -0.05em; font-weight: 700;
  }
  h1 .hy { color: var(--lime); }
  .tagline { margin-top: 16px; color: var(--mut); font-size: 1.0625rem; max-width: 34ch; }

  /* Griglia card */
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    margin: clamp(36px, 7vw, 72px) 0 64px;
  }
  .card {
    display: flex; flex-direction: column; justify-content: space-between; gap: 28px;
    min-height: 236px; padding: 20px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--line);
    cursor: pointer; transition: transform .2s ease, border-color .2s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: #4a4a4a; }
  .card.featured { background: var(--lime); border-color: var(--lime); color: var(--ink); }
  .meta { font-family: var(--mono); font-size: 11px; color: var(--mut); }
  .card.featured .meta, .card.featured .sub, .card.featured .more { color: var(--lime-sub); }
  .name {
    display: block; text-decoration: none;
    font-size: 1.875rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1.05;
  }
  .sub { margin-top: 6px; font-size: .875rem; color: var(--mut); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0;
    background: var(--lime); color: var(--ink);
    font: 500 .875rem "Space Grotesk", system-ui, sans-serif; text-decoration: none;
    cursor: pointer; transition: opacity .15s ease;
  }
  .pill:hover { opacity: .88; }
  .card.featured .pill { background: var(--ink); color: var(--lime); }
  .more { font-family: var(--mono); font-size: 12px; color: var(--mut); text-decoration: none; padding: 12px 0 12px 8px; }
  .more:hover { color: var(--fg); }
  .card.featured .more:hover { color: var(--ink); }
  .msg { grid-column: 1 / -1; color: var(--mut); padding: 24px 0; }

  footer { border-top: 1px solid var(--line); padding: 24px 0 32px; font-family: var(--mono); font-size: 12px; color: var(--mut); }

  /* Scheda app (finestra / pannello) */
  .backdrop {
    position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, 0.62);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    animation: fade .2s ease;
  }
  .sheet {
    width: 100%; max-width: 520px; max-height: calc(100vh - 48px); overflow: auto;
    background: #121212; border: 1px solid var(--line); border-radius: 22px; padding: 28px;
    animation: pop .22s ease;
  }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; }
  .sheet .meta { color: var(--lime); font-size: 12px; }
  .x {
    width: 44px; height: 44px; margin: -8px -8px 0 0; border-radius: 50%;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
    font-size: 22px; line-height: 1; cursor: pointer;
  }
  .x:hover { border-color: #555; }
  .sheet h2 { margin-top: 10px; font-size: 2.75rem; line-height: 1; letter-spacing: -0.05em; font-weight: 700; }
  .desc { margin-top: 14px; color: var(--mut); font-size: 1rem; line-height: 1.55; }
  .feat { margin-top: 18px; padding: 0; list-style: none; display: grid; gap: 8px; font-size: .9375rem; }
  .feat li { display: flex; align-items: center; gap: 10px; }
  .feat li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--lime); flex: none; }
  .tags { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--mono); font-size: 11px; }
  .tags span { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--mut); }
  .actions { margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .actions .pill { min-height: 48px; padding: 0 24px; font-size: .9375rem; }
  .ghost {
    min-height: 44px; padding: 0 14px; border: 0; background: transparent; color: var(--mut);
    font: 400 .875rem "Space Grotesk", system-ui, sans-serif; cursor: pointer; border-radius: 999px;
  }
  .ghost:hover { color: var(--fg); }

  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  @keyframes rise { from { transform: translateY(40px); opacity: .6; } }

  @media (max-width: 640px) {
    .wrap { padding: 0 20px; }
    .card { min-height: 156px; gap: 18px; }
    .backdrop { align-items: flex-end; padding: 0; }
    .sheet {
      max-width: none; max-height: 88vh; border-radius: 26px 26px 0 0; border-width: 1px 0 0;
      padding: 12px 20px 24px; animation: rise .25s ease;
    }
    .sheet::before {
      content: ""; display: block; width: 40px; height: 4px; border-radius: 2px;
      background: #3a3a3a; margin: 0 auto 16px;
    }
    .sheet h2 { font-size: 2.125rem; }
    .actions .pill { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .pill { transition: none; }
    .backdrop, .sheet { animation: none; }
  }
</style>
</head>
<body>

<svg class="bg" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="rgba(190,242,100,0.12)" stroke-width="1">
    <circle cx="84%" cy="12%" r="110"/>
    <circle cx="84%" cy="12%" r="220"/>
    <circle cx="84%" cy="12%" r="330"/>
    <circle cx="84%" cy="12%" r="440"/>
    <circle cx="84%" cy="12%" r="550"/>
    <circle cx="84%" cy="12%" r="660"/>
    <circle cx="84%" cy="12%" r="770"/>
    <circle cx="84%" cy="12%" r="880"/>
  </g>
</svg>

<div id="app">
  <div class="wrap">
    <header class="bar">
      <span>/ brain-apps</span>
      <span class="status"><span class="dot"></span><span id="count">online</span></span>
    </header>

    <main>
      <h1 id="title">Brain<span class="hy">-</span>Apps</h1>
      <p class="tagline" id="tagline">Strumenti web minimali. Apri, usa, chiudi.</p>
      <div class="grid" id="grid" aria-live="polite"><p class="msg">Caricamento…</p></div>
    </main>
  </div>
  <footer>
    <div class="wrap">ospitato su github pages</div>
  </footer>
</div>

<noscript><p style="padding:24px">Per vedere le app serve JavaScript attivo.</p></noscript>

<script>
(function () {
  "use strict";

  var appRoot = document.getElementById("app");
  var grid = document.getElementById("grid");
  var state = { site: {}, apps: [], baseTitle: document.title, inApp: false, lastFocus: null, dlg: null };

  /* ---------- utilità ---------- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === false || v == null) return;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else n.setAttribute(k, v === true ? "" : v);
    });
    (kids || []).forEach(function (c) { n.append(c); });
    return n;
  }
  function safeUrl(u) {
    try {
      var x = new URL(String(u), location.href);
      return x.protocol === "https:" || x.protocol === "http:" ? x.href : "#";
    } catch (e) { return "#"; }
  }
  function slug(s) {
    return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function label(app, i) { return pad(i + 1) + " · " + ((app.tags && app.tags[0]) || "app"); }

  /* ---------- caricamento dati ---------- */
  function load() {
    if (window.__APPS__) return Promise.resolve(window.__APPS__);
    return fetch("apps.json", { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function normalize(data) {
    var list = Array.isArray(data) ? data : (data && data.apps) || [];
    var seen = {};
    return list.filter(function (a) { return a && a.name; }).map(function (a) {
      var id = a.id ? slug(a.id) : slug(a.name);
      var base = id, n = 2;
      while (seen[id]) id = base + "-" + n++;
      seen[id] = true;
      return {
        id: id,
        name: String(a.name),
        tagline: a.tagline ? String(a.tagline) : "",
        description: a.description ? String(a.description) : "",
        url: a.url || "#",
        tags: Array.isArray(a.tags) ? a.tags.map(String) : [],
        features: Array.isArray(a.features) ? a.features.map(String) : [],
        featured: !!a.featured
      };
    });
  }

  /* ---------- home ---------- */
  function renderHero() {
    var title = (state.site && state.site.title) || "Brain-Apps";
    var h1 = document.getElementById("title");
    h1.textContent = "";
    var i = title.indexOf("-");
    if (i > -1) {
      h1.append(title.slice(0, i), el("span", { class: "hy", text: "-" }), title.slice(i + 1));
    } else { h1.append(title); }
    if (state.site && state.site.tagline) document.getElementById("tagline").textContent = state.site.tagline;
    state.baseTitle = title;
    document.title = title;
    document.getElementById("count").textContent = state.apps.length + " app · online";
  }

  function card(app, i) {
    var c = el("article", { class: "card" + (app.featured ? " featured" : "") });
    c.append(el("span", { class: "meta", text: label(app, i) }));
    var mid = el("div", {}, [
      el("a", { class: "name", href: "#/" + encodeURIComponent(app.id), text: app.name })
    ]);
    if (app.tagline) mid.append(el("p", { class: "sub", text: app.tagline }));
    c.append(mid);
    c.append(el("div", { class: "row" }, [
      el("a", {
        class: "pill", href: safeUrl(app.url), target: "_blank", rel: "noopener noreferrer",
        "aria-label": "Apri " + app.name + " (nuova scheda)", text: "Apri app ↗"
      }),
      el("a", { class: "more", href: "#/" + encodeURIComponent(app.id), "aria-label": "Scheda di " + app.name, text: "scheda →" })
    ]));
    Array.prototype.forEach.call(c.querySelectorAll('a[href^="#/"]'), function (a) {
      a.addEventListener("click", function () { state.inApp = true; });
    });
    c.addEventListener("click", function (e) {
      if (e.target.closest("a")) return;
      state.inApp = true;
      location.hash = "#/" + encodeURIComponent(app.id);
    });
    return c;
  }

  function renderGrid() {
    grid.textContent = "";
    if (!state.apps.length) {
      grid.append(el("p", { class: "msg", text: "Nessuna app da mostrare, per ora." }));
      return;
    }
    state.apps.forEach(function (a, i) { grid.append(card(a, i)); });
  }

  /* ---------- scheda app ---------- */
  function focusables(root) {
    return Array.prototype.slice.call(root.querySelectorAll("a[href], button:not([disabled])"));
  }

  function openDetail(app, index) {
    if (state.dlg) {
      if (state.dlg.dataset.id === app.id) return;
      state.dlg.remove(); state.dlg = null;
    } else {
      state.lastFocus = document.activeElement;
    }

    var closeBtn = el("button", { class: "x", type: "button", "aria-label": "Chiudi", text: "×" });
    var copyBtn = el("button", { class: "ghost", type: "button", text: "Copia link" });
    var backBtn = el("button", { class: "ghost", type: "button", text: "← Tutte le app" });

    var sheet = el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "dlg-title" }, [
      el("div", { class: "sheet-top" }, [el("span", { class: "meta", text: label(app, index) }), closeBtn]),
      el("h2", { id: "dlg-title", text: app.name }),
      el("p", { class: "desc", text: app.description || app.tagline || "" })
    ]);
    if (app.features.length) {
      sheet.append(el("ul", { class: "feat" }, app.features.map(function (f) { return el("li", { text: f }); })));
    }
    if (app.tags.length) {
      sheet.append(el("div", { class: "tags" }, app.tags.map(function (t) { return el("span", { text: t }); })));
    }
    sheet.append(el("div", { class: "actions" }, [
      el("a", { class: "pill", href: safeUrl(app.url), target: "_blank", rel: "noopener noreferrer", text: "Apri app ↗" }),
      copyBtn, backBtn
    ]));

    var backdrop = el("div", { class: "backdrop" }, [sheet]);
    backdrop.dataset.id = app.id;
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) requestClose(); });
    closeBtn.addEventListener("click", requestClose);
    backBtn.addEventListener("click", requestClose);
    copyBtn.addEventListener("click", function () {
      var done = function (t) { copyBtn.textContent = t; setTimeout(function () { copyBtn.textContent = "Copia link"; }, 1600); };
      try {
        navigator.clipboard.writeText(location.href).then(function () { done("Copiato"); }, function () { done("Non riuscito"); });
      } catch (e) { done("Non riuscito"); }
    });

    document.body.append(backdrop);
    state.dlg = backdrop;
    appRoot.inert = true;
    document.body.classList.add("lock");
    document.title = app.name + " · " + state.baseTitle;
    closeBtn.focus();
  }

  function closeDetail() {
    if (!state.dlg) return;
    state.dlg.remove(); state.dlg = null;
    appRoot.inert = false;
    document.body.classList.remove("lock");
    document.title = state.baseTitle;
    if (state.lastFocus && state.lastFocus.focus) state.lastFocus.focus();
    state.lastFocus = null;
    state.inApp = false;
  }

  function requestClose() {
    if (state.inApp) { history.back(); return; }
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; }
    route();
  }

  function route() {
    var m = location.hash.match(/^#\/(.+)$/);
    var id = m ? decodeURIComponent(m[1]) : null;
    var idx = -1;
    state.apps.forEach(function (a, i) { if (a.id === id) idx = i; });
    if (idx > -1) openDetail(state.apps[idx], idx); else closeDetail();
  }

  document.addEventListener("keydown", function (e) {
    if (!state.dlg) return;
    if (e.key === "Escape") { e.preventDefault(); requestClose(); return; }
    if (e.key === "Tab") {
      var f = focusables(state.dlg);
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  window.addEventListener("hashchange", route);

  /* ---------- avvio ---------- */
  load().then(function (data) {
    state.site = (data && !Array.isArray(data) && data.site) || {};
    state.apps = normalize(data);
    renderHero();
    renderGrid();
    route();
  }).catch(function () {
    grid.textContent = "";
    grid.append(el("p", { class: "msg", text: "Non riesco a caricare l'elenco delle app. Riprova tra poco." }));
  });
})();
</script>
</body>
</html>
